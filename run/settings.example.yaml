# scanner settings. This is the ONE file to edit; config.yaml and approval.yaml are generated from it.
# `scanner apply` runs automatically before plan, doctor and run. Replace every REPLACE_ME.

scanner_name: research-scanner        # first word of the user agent
contact: REPLACE_ME                  # opt-out and abuse e-mail; someone must read it during the run
info_url: REPLACE_ME                # public page: purpose, ports, tools, contact, how to opt out
incident_contact: ""   # who is called if something goes wrong (default: contact)

host:
  public_ip: REPLACE_ME            # the address the Internet sees; must be an address your institution approved
  source_ip: ""            # leave empty if the host carries public_ip itself; behind NAT give the private address
  interface: eth0            # network interface that owns source_ip
  egress_check: auto      # auto | nic (no outside lookup) | url (ask a public-IP service) | off
  gateway_mac: ""        # optional; detected when empty
  # zmap_source_ports: 1024-9999     # source ports of ZMap's SYNs; keep clear of the kernel's ephemeral range and the resolver's ports

scope:
  exclusions_file: exclusions.txt   # one CIDR per line: the list from the network owner plus every opt-out
  ports: [80, 443, 8080, 8090, 8443]
  sample_fraction: 0.000001   # share of routable IPv4; 0.000001 is a pilot of about 3,700 targets per port
  seed: 4
  rate_pps: 100              # ZMap packets per second
  min_seconds_between_probes_per_ip: 5   # pause between any two requests to the same address
  overlap_tls_with_zmap: auto   # auto | true | false. true: TLS starts while ZMap sweeps later ports (traffic = ZMap + ZGrab2)
  # max_connections_per_subnet: 4   # connections open at once to one /24 (IPv6 /48), 1 to 64; backs off on timeouts, 429 and 503
  # retry_after_max_hold_seconds: 30   # longest a network is left alone after a 429/503 with Retry-After, 0 to 900
  # subnet_wait_max_seconds: 120   # longest a request waits for room in its network before it is skipped unsent, 1 to 3600
  dns_resolver: REPLACE_ME      # resolver for PTR and name checks; a remote one sees every scanned address, a local recursive one (127.0.0.1) does not, but each authoritative server then sees queries from the scanner's address
  # Concurrency follows the cores, RAM and open-file limit of the host (see `scanner plan`). Set any of these to
  # fix it instead; a value set here always wins over the derived one, and a command-line flag wins over both.
  # zgrab_senders: 500                # connections per ZGrab2 process (1-1000)
  # zgrab_parallel_batches: 4         # ZGrab2 processes at once (1-64)
  # zgrab_batch_size: 20000           # addresses per ZGrab2 batch (1-100000)
  # dns_threads: 100                  # zdns threads (1-1000)
  # favicon_workers: 256              # favicon worker threads in all (1-8192)
  # favicon_processes: 4              # worker processes sharing the favicon requests
  # favicon_max_active_requests: 512  # favicon requests on the wire at once (1-8192)
  # favicon_stage_max_seconds: 86400  # time limit of the favicon stage (1-86400)
  # favicon_worker_max_lookups: 50000 # lookups after which a favicon worker process is replaced by a fresh one (0-10000000, 0 never); bounds worker memory
  try_unverified_names: false       # also request pages under certificate names that did not verify
  offhost_icons: false              # fetch icons hosted elsewhere (needs the approval to allow it); works with favicon_processes above 1
  # icon_selection: first_image       # first_image | browser_models: which declared icons are fetched; part of the config checksum
  # javascript:                       # render pages in a headless browser to find icons added by scripts; off unless enabled
  #   enabled: false
  #   max_pages_per_shard: 1000       # 1 to 10000000
  #   page_timeout_seconds: 20        # 1 to 120
  #   concurrency: auto               # 1 to 64; auto follows the cores and RAM of the host
  #   wait_ms: 1500                   # wait after load for scripts to add icons, 0 to 30000

approval:                           # copy these from the real approval; they cap what a run may ask for
  status: blocked         # `blocked` until the approving authority has approved, then `approved`
  reference: REPLACE_ME   # ticket or message reference of the approval
  valid_until: "REPLACE_ME"      # ISO 8601 with timezone, e.g. 2026-12-31T23:59:59+00:00
  max_rate_pps: 100
  max_sample_fraction: 0.000001
  min_seconds_between_probes_per_ip: 5   # the approved pause between requests to one address; never below 5
  data_handling: REPLACE_ME    # where raw output is kept, who may read it, when it is deleted

# resources:                          # optional; detected from the host when absent
#   cores: 8
#   memory_gb: 16
#   max_open_files: 65536

run:
  label: pilot
  output_dir: runs
  kill_switch_file: STOP   # `scanner stop` creates this file
  # prune_raw_keep_every: 50   # campaign: delete raw/ of each compacted shard except every 50th (0 or absent keeps all; changes the config checksum)
  # query_resolver_version: true   # ask the resolver for its software version (version.bind, CHAOS TXT) and record it in the manifest; off by default
