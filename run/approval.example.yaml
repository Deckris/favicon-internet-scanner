# Authorization record template for scanner. This is evidence consumed by the
# tool, never a decision made by it: every field must come from the real
# approval. While status is `blocked` (or any REPLACE_ME remains) the runner
# refuses to send anything.
schema_version: 1
status: blocked                  # becomes `approved` only when the approving authority has actually approved
approval_reference: REPLACE_ME   # reference / ticket of the approval
operations:
  - hostname_resolution  # ZMap + ZGrab2 + ZDNS stages
  - favicon_fetch        # remove to forbid favicon fetching (and set favicon.enabled: false)
  # offhost_icon_fetch  # contacts hosts OUTSIDE the sample (icon CDNs): add only if the approving authority explicitly allows it,
  #                              # and then set favicon.offhost_icons.enabled: true in the config
approved_domains: [REPLACE_ME]
target_population: "Seeded random sample of routable IPv4 space, excluding the exclusions file"
exclusions_checksum: REPLACE_ME  # sha256 of the exclusions file
ports: [80, 443, 8080, 8090, 8443]
protocols: [http, https]
max_rate_per_second: 100
max_sample_fraction: 0.000001    # 0.0001% (pilot size); raise only with the approving authority's agreement
source_addresses: [REPLACE_ME]   # the PUBLIC egress IPv4 the network owner sees (vantage.public_egress_ip in the config)
transparency_url: REPLACE_ME
opt_out_contact: REPLACE_ME
data_handling_reference: REPLACE_ME
incident_contact: REPLACE_ME
valid_until: "REPLACE_ME"        # quoted ISO-8601 with timezone, e.g. "2026-12-31T23:59:59+00:00"
