# Local caching resolver for the scanner host. Installed to
# /etc/unbound/unbound.conf.d/scanner.conf by run/bootstrap-host.sh, which
# rewrites the thread and slab counts (a power of two, at most 8 and at most half
# the cores), the cache sizes (RAM / 32 and twice that) and outgoing-range (the
# 5536 permitted ports divided by the threads) in the installed copy.
#
# Outgoing queries use only source ports 60000-65535. The scanner's own
# connections use 10000-59999 (net.ipv4.ip_local_port_range), so the two never
# compete for ports.
server:
    interface: 127.0.0.1
    port: 53
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    do-ip6: no

    num-threads: 8
    msg-cache-slabs: 8
    rrset-cache-slabs: 8
    infra-cache-slabs: 8
    key-cache-slabs: 8

    msg-cache-size: 1g
    rrset-cache-size: 2g
    outgoing-range: 692
    num-queries-per-thread: 346
    so-reuseport: yes

    outgoing-port-permit: 60000-65535
    outgoing-port-avoid: 0-59999

    qname-minimisation: yes

    use-syslog: no
    verbosity: 0
    log-queries: no
    log-replies: no
    log-servfail: no
